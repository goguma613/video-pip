<!doctype html><html><head><meta charset="utf-8"><title>첫 영상 - YouTube</title>
<style>
#movie_player{position:relative;width:854px;height:480px;background:#000}.html5-video-container{position:relative;width:100%;height:100%}video.html5-main-video{position:absolute}
ytd-shorts{display:block} #shorts-player{position:relative;width:405px;height:720px;background:#000} #shorts-player video{width:405px;height:720px}
</style></head><body>
<ytd-watch-flexy id="watch"><div id="movie_player" class="html5-video-player"><div class="html5-video-container">
<video class="video-stream html5-main-video" src="/land.webm" autoplay loop style="width:854px;height:480px;left:0;top:0"></video></div></div></ytd-watch-flexy>
<ytd-shorts id="shorts" hidden></ytd-shorts>
<script>
  // 유튜브처럼 플레이어가 자기 영상 요소를 기억한다(PiP로 옮겨져도 조작 가능)
  window.watchVideo = document.querySelector('#movie_player video');
  // 유튜브 플레이어 API 흉내: stopVideo는 영상 데이터를 비운다(화면이 검게 됨)
  const mp = document.getElementById('movie_player');
  mp.pauseVideo = () => watchVideo.pause();
  mp.stopVideo = () => { watchVideo.pause(); watchVideo.removeAttribute('src'); watchVideo.load(); };
  // 유튜브 SPA 이동: yt-navigate-start → (영상 정지 등) → 주소 변경 → yt-navigate-finish
  const start = (url) => window.dispatchEvent(new CustomEvent('yt-navigate-start', { detail: url ? { url } : {} }));
  const nav = (path, title) => { history.pushState({}, '', path); document.title = title; window.dispatchEvent(new Event('yt-navigate-finish')); };
  window.toShorts = () => {
    start('/shorts/abc');
    watchVideo.pause();
    document.getElementById('watch').hidden = true;
    const shorts = document.getElementById('shorts');
    shorts.hidden = false;
    if (!window.shortsVideo) {
      const r = document.createElement('ytd-reel-video-renderer'); r.setAttribute('is-active', '');
      const p = document.createElement('div'); p.id = 'shorts-player'; p.className = 'html5-video-player';
      const v = document.createElement('video'); v.src = '/portrait.webm'; v.loop = true;
      p.append(v); r.append(p); shorts.append(r); window.shortsVideo = v;
    }
    nav('/shorts/abc', '쇼츠 영상 - YouTube');
    shortsVideo.play();
  };
  window.toWatch = () => {
    start('/watch?v=nav2');
    shortsVideo.pause();
    document.getElementById('shorts').hidden = true;
    document.getElementById('watch').hidden = false;
    nav('/watch?v=nav2', '두번째 영상 - YouTube');
    watchVideo.currentTime = 0; watchVideo.play();
  };
  // 시청 페이지 → 홈: 유튜브가 시청 중이던 영상을 멈추거나(pause) 플레이어를 정지시킨다(stop: 영상 데이터 비움).
  // late면 이동이 끝난 뒤 늦게, detail=false면 이동할 곳 정보 없이.
  window.toHome = ({ late = 0, stop = false, detail = true } = {}) => {
    start(detail ? '/' : null);
    const teardown = () => (stop ? document.getElementById('movie_player').stopVideo() : watchVideo.pause());
    if (!late) teardown();
    document.getElementById('watch').hidden = true;
    nav('/', '홈 - YouTube');
    if (late) setTimeout(teardown, late);
  };
  // 다른 영상으로 이동하며 정지시키는 경우는 그대로 둬야 한다
  window.stopTowardWatch = () => { start('/watch?v=zzz'); document.getElementById('movie_player').stopVideo(); };
</script></body></html>
